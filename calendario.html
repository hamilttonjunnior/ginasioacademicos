<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio - FCA Os Académicos - Gestão 2026/2027</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-white text-zinc-900 font-sans antialiased min-h-screen flex flex-col">

  <!-- CABEÇALHO DA PÁGINA PÚBLICA -->
  <header class="border-b border-zinc-200 bg-white sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <div class="flex items-center gap-4">
          <img src="logo.png" alt="Logo FCA Os Académicos" class="h-12 w-auto object-contain">
          <div>
            <span class="font-bold text-lg sm:text-xl tracking-tight uppercase block leading-none">GINÁSIO - FCA OS ACADÉMICOS</span>
            <span class="text-xs text-zinc-400 uppercase tracking-wider font-semibold mt-1 block">GESTÃO 2026/2027</span>
          </div>
        </div>
        <a href="index.html" class="text-xs sm:text-sm font-medium text-zinc-600 hover:text-black transition-colors flex items-center gap-1">
          ← Área de Gestão
        </a>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <div class="flex items-center gap-6 text-xs text-zinc-600 border-b border-zinc-100 pb-3">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-black block"></span>
        <span>Académicos</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-zinc-600 block"></span>
        <span>Atividade Freguesia</span>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-500">Próximos Horários Ocupados</h2>
      <div id="container-calendario" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-xs text-zinc-400">A carregar horários do ginásio...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlxQwwkAu0b7vSlYiPrMSbgOExA9I8NDk",
      authDomain: "ginasioacademicos.firebaseapp.com",
      projectId: "ginasioacademicos",
      storageBucket: "ginasioacademicos.firebasestorage.app",
      messagingSenderId: "439823065516",
      appId: "1:439823065516:web:f58a02b8d775437b99da09",
      measurementId: "G-MXYVD291LH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const marcacoesRef = collection(db, "marcacoes");
    const qMarcacoes = query(marcacoesRef, orderBy("data", "asc"));

    onSnapshot(qMarcacoes, (snapshot) => {
      const container = document.getElementById('container-calendario');
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<div class="col-span-full border border-dashed border-zinc-300 p-8 text-center text-xs text-zinc-500">Sem horários marcados para os próximos dias.</div>';
        return;
      }

      snapshot.docs.forEach(docSnap => {
        const m = docSnap.data();
        const isAcademicos = m.vinculo === 'academicos';

        container.innerHTML += `
          <div class="border border-zinc-200 p-4 space-y-3 bg-white hover:border-black transition-colors">
            <div class="flex justify-between items-center border-b border-zinc-100 pb-2">
              <span class="text-xs font-bold bg-zinc-100 border border-zinc-200 px-2 py-0.5">${m.data}</span>
              <span class="${isAcademicos ? 'bg-black text-white' : 'bg-zinc-600 text-white'} text-[9px] uppercase font-bold tracking-wider px-2 py-0.5">
                ${m.vinculo}
              </span>
            </div>
            <div>
              <span class="text-xs font-semibold text-zinc-500 block">${m.horaInicio} às ${m.horaFim}</span>
              <h3 class="font-bold text-sm text-zinc-900 mt-1">${m.nome}</h3>
            </div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
