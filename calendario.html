<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Os Académicos - Centro de Formação Desportiva</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FullCalendar CSS & JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Estilos para adaptar o FullCalendar ao tema P&B -->
  <style>
    /* Personalização do FullCalendar para Preto & Branco Minimalista */
    .fc {
      font-family: 'Inter', sans-serif;
      --fc-border-color: #e4e4e7;
      --fc-button-bg-color: #000000;
      --fc-button-border-color: #000000;
      --fc-button-hover-bg-color: #27272a;
      --fc-button-hover-border-color: #27272a;
      --fc-button-active-bg-color: #18181b;
      --fc-button-active-border-color: #18181b;
      --fc-today-bg-color: #fafafa;
    }

    .fc .fc-toolbar-title {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.025em;
    }

    .fc .fc-button {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      border-radius: 0px;
      padding: 0.4rem 0.8rem;
    }

    .fc-theme-standard td, .fc-theme-standard th {
      border-color: #f4f4f5;
    }

    .fc-col-header-cell {
      background-color: #fafafa;
      padding: 8px 0;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #52525b;
    }

    /* Eventos estilo P&B */
    .fc-event {
      cursor: pointer;
      border-radius: 2px !important;
      padding: 2px 4px !important;
      font-size: 0.75rem !important;
      border: none !important;
    }

    .evento-academicos {
      background-color: #000000 !important;
      color: #ffffff !important;
    }

    .evento-freguesia {
      background-color: #52525b !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="bg-white text-zinc-900 font-sans antialiased min-h-screen flex flex-col">

  <!-- CABEÇALHO DA PÁGINA PÚBLICA -->
  <header class="border-b border-zinc-200 bg-white sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <div class="flex items-center gap-4">
          <img src="logo.png" alt="Logo FCA Os Académicos" class="h-12 w-auto object-contain" onerror="this.style.display='none'">
          <div>
            <span class="font-bold text-lg sm:text-xl tracking-tight uppercase block leading-none">FC Os Académicos - Centro de Formação Desportiva</span>
            <span class="text-xs text-zinc-400 uppercase tracking-wider font-semibold mt-1 block">GESTÃO 2026/2027</span>
          </div>
        </div>
        <a href="index.html" class="text-xs sm:text-sm font-medium text-zinc-600 hover:text-black transition-colors flex items-center gap-1">
          ← Área de Gestão
        </a>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">
    
    <!-- LEGENDA RÁPIDA -->
    <div class="flex items-center gap-6 text-xs text-zinc-600 border-b border-zinc-100 pb-3">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-black block rounded-xs"></span>
        <span class="font-medium">Académicos</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-zinc-600 block rounded-xs"></span>
        <span class="font-medium">Atividade Freguesia</span>
      </div>
    </div>

    <!-- CALENDÁRIO GOOGLE STYLE -->
    <div id="calendar" class="min-h-[600px] bg-white border border-zinc-200 p-2 sm:p-4"></div>

  </main>

  <!-- MODAL POP-UP DE DETALHES DA MARCAÇÃO -->
  <div id="modal-detalhes" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white border border-black w-full max-w-sm p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-start border-b border-zinc-200 pb-3">
        <div>
          <span id="detalhe-vinculo" class="text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 bg-black text-white rounded-xs"></span>
          <h3 id="detalhe-nome" class="font-bold text-base mt-2"></h3>
        </div>
        <button onclick="fecharModalDetalhes()" class="text-zinc-500 hover:text-black font-bold text-lg">✕</button>
      </div>

      <div class="space-y-2 text-xs text-zinc-600">
        <div>
          <span class="font-semibold text-zinc-400 uppercase block text-[10px]">Data</span>
          <p id="detalhe-data" class="font-medium text-zinc-900 text-sm"></p>
        </div>
        <div>
          <span class="font-semibold text-zinc-400 uppercase block text-[10px]">Horário</span>
          <p id="detalhe-horario" class="font-medium text-zinc-900 text-sm"></p>
        </div>
      </div>

      <div class="pt-3 border-t border-zinc-100 text-right">
        <button onclick="fecharModalDetalhes()" class="px-4 py-1.5 text-xs font-semibold bg-black text-white hover:bg-zinc-800">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT FIREBASE & FULLCALENDAR -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlxQwwkAu0b7vSlYiPrMSbgOExA9I8NDk",
      authDomain: "ginasioacademicos.firebaseapp.com",
      projectId: "ginasioacademicos",
      storageBucket: "ginasioacademicos.firebasestorage.app",
      messagingSenderId: "439823065516",
      appId: "1:439823065516:web:f58a02b8d775437b99da09",
      measurementId: "G-MXYVD291LH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const marcacoesRef = collection(db, "marcacoes");

    let calendar;

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'pt-br',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        buttonText: {
          today: 'Hoje',
          month: 'Mês',
          week: 'Semana',
          day: 'Dia',
          list: 'Lista'
        },
        slotMinTime: '07:00:00',
        slotMaxTime: '23:30:00',
        allDaySlot: false,
        eventClick: function(info) {
          mostrarDetalhesEvento(info.event);
        }
      });

      calendar.render();

      // SINCRONIZAR COM O FIREBASE EM TEMPO REAL
      onSnapshot(marcacoesRef, (snapshot) => {
        const eventos = [];

        snapshot.docs.forEach(docSnap => {
          const m = docSnap.data();
          const startIso = `${m.data}T${m.horaInicio}:00`;
          const endIso = `${m.data}T${m.horaFim}:00`;
          const isAcademicos = m.vinculo === 'academicos';

          eventos.push({
            id: docSnap.id,
            title: `${m.nome} (${m.horaInicio}-${m.horaFim})`,
            start: startIso,
            end: endIso,
            className: isAcademicos ? 'evento-academicos' : 'evento-freguesia',
            extendedProps: {
              nome: m.nome,
              vinculo: m.vinculo,
              data: m.data,
              horaInicio: m.horaInicio,
              horaFim: m.horaFim
            }
          });
        });

        calendar.removeAllEvents();
        calendar.addEventSource(eventos);
      });
    });

    // MOSTRAR MODAL DE DETALHES
    function mostrarDetalhesEvento(event) {
      const props = event.extendedProps;
      const isAcademicos = props.vinculo === 'academicos';

      document.getElementById('detalhe-nome').innerText = props.nome;
      document.getElementById('detalhe-data').innerText = props.data;
      document.getElementById('detalhe-horario').innerText = `${props.horaInicio} às ${props.horaFim}`;
      
      const vinculoBadge = document.getElementById('detalhe-vinculo');
      vinculoBadge.innerText = props.vinculo;
      vinculoBadge.className = `text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-xs ${isAcademicos ? 'bg-black text-white' : 'bg-zinc-600 text-white'}`;

      document.getElementById('modal-detalhes').classList.remove('hidden');
    }

    window.fecharModalDetalhes = function() {
      document.getElementById('modal-detalhes').classList.add('hidden');
    };
  </script>
</body>
</html>
